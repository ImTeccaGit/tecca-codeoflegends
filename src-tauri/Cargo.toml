[package]
name = "tecca-codeoflegends"
version = "0.10.0"
description = "TECCA CODEOFLEGENDS desktop companion for League of Legends"
authors = ["Tecca"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tecca_codeoflegends_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-log = "2"
# Global shortcut for the in-game board (registered from Rust only).
tauri-plugin-global-shortcut = "2"
log = "0.4"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# HTTP client for public Riot static data (Data Dragon). Native TLS = Windows
# SChannel and the OS certificate store; no extra native build tools needed.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "charset", "http2"] }
# Riot API key storage in the OS credential store (Windows Credential Manager).
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# Async runtime for the (ignored by default) live Data Dragon test.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
